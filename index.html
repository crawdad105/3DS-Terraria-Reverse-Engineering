<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, html{
            width: 100%;
            margin: 0px;
        }
        body{
            background-color: #242627;
            color: #E6E2DE;
        }
        #main{
            display: flex;
            justify-content: center;
            flex-direction: column;
            width: 80%;
            align-items: center;
            justify-self: center;
        }
        table{
            border-bottom: 1px solid #747777;
            border-right: 1px solid #747777;
            border-top: 1px solid #e6e6e6;
            border-left: 1px solid #e6e6e6;
            padding: 3px;
            background-color: #434748;
            font-family: monospace;
        }
        td, th{
            border-top: 1px solid #747777;
            border-left: 1px solid #747777;
            border-bottom: 1px solid #e6e6e6;
            border-right: 1px solid #e6e6e6;
            background-color: #0F1111;
        }
        .var{
            color: #81D1F1;
        }
        .func{
            color: #A4B7F1;
        }
        .num{
            color: #81EE9E;
        }
        #content{
            font-family: monospace;
            width: 100%;
        }
        #content > div{
            content-visibility: auto;
            contain-intrinsic-size: 24px;
        }
    </style>
    <script>
        var exampleData = {
            "Address": 805320644,
            "AddressString": "300037c4",
            "Name": "Tile_Main[0x180858]",
            "Type": "Tile",
            "Other": "",
            "IsFunction": false,
            "IsCodeVariable": false,
            "IsUserDefined": true,
            "ToStringValue": "0x300037c4 Tile Tile_Main[0x180858]"
        }
        async function Search(event) {

            try {
                const input = textInput.value;
                if ((input.length == 0) && includeDefault.checked){
                    if (!disSafeSearch.checked){
                        alert("These search parameters are invalid, it would cause the page to display too much content.\nYou can disable safe search and try again if you really want this.");
                        return;
                    }
                }
                const response = await fetch('./data.json');
                const data = await response.json();
                var htmlData = "";
                for (let i = 0; i < data.length; i++) {
                    exampleData = data[i];
                    if (!includeDefault.checked && !exampleData.IsUserDefined) continue;
                    var reg;
                    if (regexSearch.checked ? (reg = exampleData.Name.match(input) != null) : (!matchCase ? exampleData.Name : exampleData.Name.toLowerCase()).includes(!matchCase ? input : input.toLowerCase())){
                        console.log(exampleData.Name);
                    } else{
                        continue;
                    }
                    if (exampleData.IsFunction){
                        htmlData += `
                            <div class="${exampleData.IsCodeVariable ? "codeVar" : ""} isFunction ${exampleData.IsUserDefined ? "" : "defaultName"}">
                            <span class="num">0x${exampleData.AddressString}</span>
                            ${exampleData.Type} <span class="func name">${exampleData.Name}</span>(<span class="param">${exampleData.Other}</span>)
                            </div>
                        `
                    }
                    else {
                        htmlData += `
                            <div class="${exampleData.IsCodeVariable ? "codeVar" : ""} isVariable ${exampleData.IsUserDefined ? "" : "defaultName"}">
                            <span class="num">0x${exampleData.AddressString}</span>
                            ${exampleData.Type} <span class="var name">${exampleData.Name}</span>
                            </div>
                        `
                    }
                }
                content.innerHTML = htmlData;
            } catch (error) {
                console.error("Error loading JSON:", error);
            }
        }
    </script>
</head>
<body>
    <div id="main">
        <div id="options">
            <div> <input id="textInput" type="text" placeholder="Input Search Query..." onkeydown="if (event.key === 'Enter') Search(event)"/><button type="submit" onclick="Search(event)">Search</button></div>
            <div> <input type="checkbox" id="matchCase"/><label>Match Cases</label></div>
            <div> <input type="checkbox" id="regexSearch"/><label>Toggle Regex Search</label></div>
            <div> <input type="checkbox" id="includeDefault"/><label>Include default symbols</label></div>
            <div> <input type="checkbox" id="disSafeSearch"/><label>Disable Safe Search</label></div>
        </div>

        <div id="content">


        </div>
    </div>
</body>
</html>
